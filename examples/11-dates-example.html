<!DOCTYPE html>
<html>
<body>

<h1>JavaScript Dates</h1>
<h2>Using new Date()</h2>

<p id="demo"></p>

<script>
const d = new Date("2022-03-25");
document.getElementById("demo").innerHTML = d;
</script>

<h2>Using new Date()</h2>

<p>A date object can be created with a specified date and time:</p>
<p id="demo1"></p>

<script>
const d1 = new Date("October 13, 2014 11:13:00");
document.getElementById("demo1").innerHTML = d1;
</script>

<h2>JavaScript new Date()</h2>

<p>Using new Date(7 numbers), creates a new date object with the specified date and time:</p>

<p id="demo2"></p>

<script>
const d2 = new Date(2018, 11, 24, 10, 33, 30, 0);
document.getElementById("demo2").innerHTML = d2;
</script>

<h1>JavaScript new Date()</h1>

<p>JavaScript counts months from 0 to 11.</p>

<p id="demo3"></p>

<script>
const d3 = new Date(2019, 3, 24, 10, 33, 30, 0);
document.getElementById("demo3").innerHTML = d3;
</script>

</body>
</html>
