<!DOCTYPE html>
<html>
<body>
<h1>Regular Expressions</h1>
<h2>The match() Method</h2>

<p>Search for "w3Schools" and display the first match:</p>

<p id="demo"></p>

<script>
let text = "Visit W3Schools!"; 
const myArr = text.match(/W3Schools/);

document.getElementById("demo").innerHTML = myArr;
</script>

<h2>The replace() Method</h2>

<p>Replace "Microsoft" with "W3Schools" in the paragraph below:</p>

<p id="demo1">Please visit Microsoft!</p>

<script>
let text1 = document.getElementById("demo1").innerHTML;
text1 = text1.replace(/Microsoft/, "W3Schools");

document.getElementById("demo1").innerHTML = text1;
</script>

<h2>The /g Flag</h2>

<p>A global search for "is" in a string:</p>

<p id="demo2"></p>

<script>
let text2 = "Is this all there is?";
const pattern = /is/g;

let result = text2.match(pattern);

document.getElementById("demo2").innerHTML = result; 
</script>

</body>
</html>
